name: pipeline ci-cd for flask basic api

on:
  push:
    branches: [ main ]

jobs:
   test-and-build:
     runs-on: ubuntu-latest
     steps:
       - name: recuperer le code
         uses: actions/checkout@v4
       - name: setup python
         uses: actions/setup-python@v4
         with:
           python-version: '3.12'
           cache: pip
       - name: install dependancies
         run: pip install -r requirements.txt

       - name: test du code
         run: pytest
       - name: lint
         run: flake8 .

   build-and-push:
     runs-on: ubuntu-latest
     needs: test-and-build
     permissions:
       id-token: write
       contents: read
     outputs:
       image_tag: ${{ steps.id-tag.outputs.tag }}
     steps:
       - name: recuperer le code
         uses: actions/checkout@v4
       - name: build-docker-image
         id: id-tag
         run: |
          docker build -t my-pyapp:${{ github.sha }} .
          echo "tag=sha-${{ github.sha }}" >> "$GITHUB_OUTPUT"

       - name: Inspecter le Jeton OIDC GitHub (Debug JWT)
         run: |
           TOKEN=$(curl -s -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | jq -r '.value')
           echo "=== Contenu du jeton décodé ==="
           echo $TOKEN | cut -d. -f2 | base64 -d 2>/dev/null | jq .

       - name: login To aws
         uses: aws-actions/configure-aws-credentials@v4
         with:
           role-to-assume: arn:aws:iam::875691018539:role/githubworkflowRoles
           aws-region: eu-central-1

       - name: login to ECR
         id: login-ecr
       #  run: aws ecr get-login-password --region eu-central-1 | \
        #    docker login --username AWS --password-stdin 875691018539.dkr.ecr.eu-central-1.amazonaws.com
         uses: aws-actions/amazon-ecr-login@v2

       - name: push docker-image to ECR registry
         run: |
            docker tag my-pyapp:${{ github.sha }} 875691018539.dkr.ecr.eu-central-1.amazonaws.com/my-pyapp:${{ github.sha }}
            docker push 875691018539.dkr.ecr.eu-central-1.amazonaws.com/my-pyapp:${{ github.sha }}
   deploy-to-ec2:
     runs-on: ubuntu-latest
     needs: build-and-push
     permissions:
       id-token: write
       contents: read
     steps:
       - name: log to aws
         uses: aws-actions/configure-aws-credentials@v4
         with:
           role-to-assume: arn:aws:iam::875691018539:role/githubworkflowRoles
           aws-region: eu-central-1
       - name: deploying on EC2 with ssm
         run: |
           COMMAND_ID=$(aws ssm send-command \
             --instance-ids "i-0ebfb49f3f35806cd" \
             --document-name "AWS-RunShellScript" \
             --parameters 'command=[
               "aws ecr get-login-password --region eu-central-1 | docker login --username AWS --password-stdin 875691018539.dkr.ecr.eu-central-1.amazonaws.com",
               "docker pull 875691018539.dkr.ecr.eu-central-1.amazonaws.com/my-pyapp:${{ github.sha }}",
               "docker stop my-pyapp || true",
               "docker rm -m my-pyapp || true",
               "docker run -d --name my-pyapp --restart always -p 80:5000 875691018539.dkr.ecr.eu-central-1.amazonaws.com/my-pyapp:${{ github.sha }}"

              ]' \
            --region eu-central-1 \
            --query "command.Command-Id" \
            --output text)

           aws ssm wait command-executed \
             --command-id "$COMMAND-ID"
             --instance-id "i-0ebfb49f3f35806cd"
             --region eu-central-1

           STATUS=$(aws ssm get-command-invocation \
             --command-id "COMMAND-ID"
             --instance-id "i-0ebfb49f3f35806cd" \
             --region eu-cenral-1 \
             query "status" --output text)

           if [ "$STATUS" =! "success"],
             exit 1
           fi

