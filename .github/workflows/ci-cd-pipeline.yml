name: pipeline ci-cd for flask basic api

on:
  push:
    branches: [ main ]

jobs:
   test-and-build:
     runs-on: ubuntu-latest
     steps:
       - name: recuperer le code
         uses: actions/checkout@v4
       - name: setup python
         uses: actions/setup-python@v4
         with:
           python-version: '3.12'
           cache: pip
       - name: install dependancies
         run: pip install -r requirements.txt

       - name: test du code
         run: pytest
       - name: lint
         run: flake8 .

   build-and-push:
     runs-on: ubuntu-latest
     needs: test-and-build
     permissions:
       id-token: write
       contents: read
     outputs:
       image_tag: ${{ steps.id-tag.outputs.tag }}
     steps:
       - name: build-docker-image
         uses: actions/checkout@v4
         id: id-tag
         run: |
          docker build -t my-pyapp:${{ github.sha }} .
          echo "tag=sha-${{ github.sha }}" >> "$GITHUB_OUTPUT"

       - name: login aws
         uses: aws-actions/configure-aws-credentials@v4
         with:
           role-to-assume: arn:aws:iam::****:role/GitHubActionsRole
           aws-region: eu-central-1

