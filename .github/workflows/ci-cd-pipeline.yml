name: pipeline ci-cd for flask basic api

on:
  push:
    branches: [ main ]

jobs:
   test-and-build:
     runs-on: ubuntu-latest
     steps:
       - name: recuperer le code
         uses: actions/checkout@v4
       - name: setup python
         uses: actions/setup-python@v4
         with:
           python-version: '3.12'
           cache: pip
       - name: install dependancies
         run: pip install -r requirements.txt

       - name: test du code
         run: pytest
       - name: lint
         run: flake8 .

   build-and-push:
     runs-on: ubuntu-latest
     needs: test-and-build
     permissions:
       id-token: write
       contents: read
     outputs:
       image_tag: ${{ steps.id-tag.outputs.tag }}
     steps:
       - name: recuperer le code
         uses: actions/checkout@v4
       - name: build-docker-image
         id: id-tag
         run: |
          docker build -t my-pyapp:${{ github.sha }} .
          echo "tag=sha-${{ github.sha }}" >> "$GITHUB_OUTPUT"

       - name: login To aws
         uses: aws-actions/configure-aws-credentials@v4
         with:
           role-to-assume: arn:aws:iam::875691018539:role/GithubWorkflowRole
           aws-region: eu-central-1

       - name: login to ECR
         run: aws ecr get-login-password --region eu-central-1 | \
            docker login --Username AWS --password-stdin 875691018539.dkr.ecr.eu-central-1.amazonaws.com

       - name: push docker-image to ECR registry
         run: |
            docker tag my-pyapp:${{ github.sha }} 875691018539.dkr.ecr.eu-central-1.amazonaws.com/my-pyapp:${{ github.sha }}
            docker push 875691018539.dkr.ecr.eu-central-1.amazonaws.com/my-pyapp:${{ github.sha }}


